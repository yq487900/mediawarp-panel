name: Build and push image (GHCR + Docker Hub)

# 推送到 main 或打 v* 标签时：构建多架构镜像（amd64 + arm64）并推送两处：
#   · GHCR       —— ghcr.io/<owner>/<repo>（用内置 GITHUB_TOKEN；公开仓库的包可匿名拉取）
#   · Docker Hub —— <DOCKERHUB_USERNAME>/mediawarp-panel
#
# **tag 规则**（与 tg-forwarder 保持一致，别再出现分支名/次版本这类重复 tag）：
#   · latest    —— 最新一次发布（推 main 或打 v* 标签都会打）
#   · 版本号    —— 只在打 v* 标签时出现（v1.0.0 → 1.0.0）
#   发布时两者指向同一个镜像（同一 digest）；发大版本：git tag v1.1.0 && git push origin v1.1.0
#
# 首次使用前，在仓库 Settings → Secrets and variables → Actions 里加两个密钥：
#   DOCKERHUB_USERNAME  = Docker Hub 用户名
#   DOCKERHUB_TOKEN     = Docker Hub Access Token（Account Settings → Security → New Access Token，权限 Read & Write）
# 没配这两个密钥时，本工作流只推 GHCR（Docker Hub 相关步骤自动跳过，不会报红）。

on:
  push:
    branches: [main]
    tags: ['v*']
    # 纯文档改动不触发构建，省 CI 时间
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mediawarp_version:
        description: 'MediaWarp 版本号（例如 0.1.12）'
        required: false
        default: '0.2.4'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mediawarp-panel
  DEFAULT_MW_VERSION: '0.2.4'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub 凭据是否已配置
        id: dh
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只推送 GHCR"
          fi

      - name: 组装镜像列表（GHCR 必推，Docker Hub 视密钥而定）
        id: imgs
        run: |
          {
            echo "list<<EOF"
            echo "${{ env.GHCR_IMAGE }}"
            if [ "${{ steps.dh.outputs.ok }}" = "yes" ]; then
              echo "${{ env.DOCKERHUB_IMAGE }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU（多架构必需）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dh.outputs.ok == 'yes'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgs.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          # 只打两种 tag：版本号（打 v* 标签时）+ latest —— 两个 tag 是同一个镜像。
          # 不打分支名（main）也不打次版本（1.0），避免同一镜像出现多个重复 tag。

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MEDIAWARP_VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.mediawarp_version || env.DEFAULT_MW_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
